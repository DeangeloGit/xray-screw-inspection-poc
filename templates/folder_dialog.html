<dialog id="folder-dialog"><h2>選擇取圖資料夾</h2><p class="hint">這裡顯示的是執行程式的 Mac 或 IPC 上的資料夾。</p><form id="folder-navigation"><label for="folder-location">目前位置</label><div class="path-row"><input id="folder-location" type="text"><button type="submit">前往</button></div></form><button id="folder-parent" type="button">↑ 上一層</button><div id="folder-list" class="folder-list"></div><p id="folder-message" class="message" role="status"></p><div class="actions"><button id="confirm-folder" class="primary">選用這個資料夾</button><button id="cancel-folder">取消</button></div></dialog>
