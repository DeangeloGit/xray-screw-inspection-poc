<section id="workspace" class="workspace" hidden><section class="photo-panel"><div class="photo-toolbar"><span id="viewer-caption">點選框，查看右側放大圖</span><button id="view-toggle">顯示全圖</button></div><svg id="viewer" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="X光照片與疑似位置"></svg><p class="image-hint">框選位置只是提示，請同時檢查整張照片。</p></section>
<section class="inspection-panel"><div id="candidate-view"><div class="candidate-heading"><h2>確認這個位置</h2><span id="position-count"></span></div><img id="crop" alt="目前疑似位置的放大圖"><p id="ai-advice" class="hint" role="status"></p><p class="question">這是掉落的螺絲嗎？</p><div class="decision-buttons"><button data-label="screw" class="yes">是螺絲</button><button data-label="normal">不是螺絲</button><button data-label="uncertain">不確定</button></div><p id="saved" class="saved" role="status"></p><div class="position-nav"><button id="previous-position" aria-label="上一個疑似位置">← 上個位置</button><button id="next-position" aria-label="下一個疑似位置">下個位置 →</button></div><div id="position-dots" class="position-dots" aria-label="疑似位置導覽"></div></div>
<div id="no-candidates" class="empty" hidden><h2>沒有找到疑似位置</h2><p>仍需查看整張照片，確認是否有漏掉的螺絲。</p></div>
<section id="photo-decision" class="photo-decision"><h2 id="completion-title">照片結果</h2><p id="completion-hint"></p><div id="zero-candidate-decision" class="final-buttons" hidden><button data-decision="screw">確認有螺絲</button><button data-decision="no_screw_seen">人工未見螺絲</button><button data-decision="uncertain">需再確認</button></div><p id="completion-saved" class="saved" role="status"></p><button id="finish-next" class="primary" hidden>查看下一張 →</button><details id="supplemental-review"><summary>補充：框外螺絲或需再確認</summary><p class="muted">僅在框外發現螺絲或整張照片有疑問時使用。</p><div class="final-buttons"><button data-decision="screw">框外發現螺絲</button><button data-decision="uncertain">整張需再確認</button></div></details></section></section></section>
<div id="failure" class="failure" hidden><h2>這張照片需要人工檢查</h2><p id="failure-reason"></p><button id="retry">重新檢查</button><a id="failure-engineer" href="/engineer">在工程模式查看</a></div>
