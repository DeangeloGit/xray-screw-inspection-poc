<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>5r 資料夾驗證</title><link rel="stylesheet" href="/static/app.css"><body><main style="max-width:1000px;margin:auto;padding:24px"><a href="/">返回檢測頁面</a><h1>5r 資料夾驗證</h1><p>選擇 NG 或 OK 資料夾，一次檢查全部圖檔（含子資料夾）。NG 都視為有掉落螺絲；OK 都視為沒有掉落螺絲。</p><form id="batch5r-form" style="display:grid;gap:10px;margin:18px 0"><label for="batch5r-machine">本批機種／正常參照圖</label><select id="batch5r-machine" required></select><label for="batch5r-folder">NG／OK 資料夾</label><input id="batch5r-folder" type="text" required style="width:100%"><button id="batch5r-pick" type="button">選擇資料夾</button><button id="batch5r-start" class="primary" type="submit">開始整批檢測並產出報表</button></form><p>支援 PNG、JPG、JPEG、TIF、TIFF、BMP。每個圖檔計一張，相同影像不合併；一批請使用同一機種。來源原圖及人工紀錄保留。</p><p>NG 沒有警報計為「未檢出」；OK 有警報計為「誤報」。處理失敗與參照圖自比分開列出。NG 有警報仍須確認是否命中真正螺絲。</p><p id="batch5r-status" role="status"></p><progress id="batch5r-progress" max="1" value="0"></progress><p><a id="batch5r-report" hidden target="_blank" rel="noopener">開啟完整報表（含逐張 CSV）</a></p></main>{% include 'folder_dialog.html' %}<script src="/static/folder-picker.js"></script><script src="/static/folder-batch5r.js"></script></body></html>
