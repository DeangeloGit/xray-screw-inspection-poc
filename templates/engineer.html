<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工程設定 · X光螺絲複檢</title><link rel="stylesheet" href="/static/analysis.css"><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/dino-examples.css"></head><body data-initial-tab="{{ initial_tab|default('machines') }}">{% set current_mode = 'engineer' %}{% include 'app_header.html' %}
<main class="engineer-shell"><div class="page-heading"><div><h1>工程設定</h1><p class="muted">先準備機型與參考圖，再設定取圖來源。</p></div><a class="help-link" href="/help/engineer" target="_blank" rel="noopener">使用說明 ↗</a></div>
<div class="engineer-layout"><nav class="engineer-nav" aria-label="工程功能"><button data-engineer-tab="machines">機型與參考圖</button><button data-engineer-tab="source">取圖資料夾</button><button data-engineer-tab="ai">AI 模型（選用）</button></nav><div class="engineer-content">
<section data-engineer-panel="machines"><div class="section-heading"><h2>機型與正常參考圖</h2><button id="add-machine" class="primary" type="button">＋ 新增機型</button></div><p class="muted">每個機型使用自己的正常參考圖。現場人員依檢測機型選用。</p><div id="machine-list" class="machine-list"></div><section id="machine-editor" class="machine-editor" hidden><h3 id="machine-editor-title">新增機型</h3><form id="machine-form" class="form-stack"><label>機型名稱<input id="machine-name" name="name" required maxlength="80"></label><label>正常參考圖<input name="reference" id="machine-reference" type="file" accept="image/png,image/jpeg,image/tiff" required></label><img id="machine-preview" class="reference-preview" alt="選取的正常參考圖預覽" hidden><p class="muted">請使用同機型、同拍攝條件、無掉落螺絲的正常照片。更換後需重新檢查，舊複判紀錄仍保留。</p><div class="actions"><button id="save-machine" class="primary" type="submit">儲存機型與參考圖</button><button id="cancel-machine" type="button">取消</button></div></form></section><p id="machine-status" class="message" role="status"></p></section>
{% include 'engineering_settings.html' %}

</div></div></main>{% include 'folder_dialog.html' %}<script src="/static/folder-picker.js"></script><script src="/static/machines-engineer.js"></script><script src="/static/settings.js"></script><script src="/static/engineer-shell.js"></script><script src="/static/dino-examples.js"></script></body></html>
