<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X光螺絲複檢</title><link rel="stylesheet" href="/static/user.css"></head>
<body><header class="app-header"><div class="brand"><span class="brand-mark">X</span><strong>X光螺絲複檢</strong></div><nav aria-label="操作模式"><span class="mode current">使用者模式</span><a id="engineering-link" class="mode" href="/engineer">工程模式</a><a class="mode" href="/help/user" target="_blank" rel="noopener">使用說明 ↗</a></nav></header>
<div class="app-shell"><aside class="library"><div class="library-head"><h2>照片</h2><button id="refresh" class="icon-button" title="重新掃描 data 資料夾" aria-label="重新掃描照片">↻</button></div><p id="library-count" class="muted">讀取照片中…</p><button id="batch" class="batch-button">全部檢查</button><div class="report-selection"><button id="select-all-report">全選</button><button id="clear-report">清除選取</button></div><button id="export-report" class="batch-button">匯出本批螺絲表單</button><div id="report-status" class="muted" role="status"></div><div id="station-status" class="muted" role="status"></div><div id="batch-status" class="muted" role="status"></div><div id="file-list" class="file-list" aria-label="照片清單"></div><label class="upload-button">上傳照片<input id="upload" type="file" accept="image/png,image/jpeg,image/tiff"></label><p class="library-note">自動取圖啟用後清單會更新。勾選照片組成本批次（預設全選）；需完成整張複判，SN 留白。</p></aside>
<main><div class="photo-heading"><div><h1 id="photo-name">選擇一張照片</h1><p id="photo-state" class="muted">先看標記位置，再確認整張照片。</p></div><div class="photo-nav"><button id="previous-photo" aria-label="上一張照片">← 上一張</button><button id="next-photo" aria-label="下一張照片">下一張 →</button></div></div>
<div id="notice" class="notice" role="status" aria-live="polite">正在讀取資料夾…</div>
<section id="workspace" class="workspace" hidden><section class="photo-panel"><div class="photo-toolbar"><span id="viewer-caption">點選框，查看右側放大圖</span><button id="view-toggle">顯示全圖</button></div><svg id="viewer" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="X光照片與疑似位置"></svg><p class="image-hint">框選位置只是提示，請同時檢查整張照片。</p></section>
<section class="inspection-panel"><div id="candidate-view"><div class="candidate-heading"><h2>確認這個位置</h2><span id="position-count"></span></div><img id="crop" alt="目前疑似位置的放大圖"><p class="question">這是掉落的螺絲嗎？</p><div class="decision-buttons"><button data-label="screw" class="yes">是螺絲</button><button data-label="normal">不是螺絲</button><button data-label="uncertain">不確定</button></div><p id="saved" class="saved" role="status"></p><div class="position-nav"><button id="previous-position" aria-label="上一個疑似位置">← 上個位置</button><button id="next-position" aria-label="下一個疑似位置">下個位置 →</button></div><div id="position-dots" class="position-dots" aria-label="疑似位置導覽"></div></div>
<div id="no-candidates" class="empty" hidden><h2>沒有找到疑似位置</h2><p>仍需查看整張照片，確認是否有漏掉的螺絲。</p></div>
<section id="photo-decision" class="photo-decision"><h2>整張照片的結果</h2><p id="completion-hint">請先逐一確認所有標記位置。</p><div class="final-buttons"><button data-decision="screw">有螺絲</button><button data-decision="no_screw_seen">人工未見螺絲</button><button data-decision="uncertain">需再確認</button></div><p id="completion-saved" class="saved" role="status"></p><button id="finish-next" class="primary" hidden>已儲存，查看下一張 →</button></section></section></section>
<div id="failure" class="failure" hidden><h2>這張照片需要人工檢查</h2><p id="failure-reason"></p><button id="retry">重新檢查</button><a id="failure-engineer" href="/engineer">在工程模式查看</a></div>
<footer>本機處理 · 所有照片都需要人工確認</footer></main></div><script src="/static/user.js"></script></body></html>
